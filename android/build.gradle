plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'com.daily.reactlibrary'
version = '0.1.0'

android {
    namespace 'com.daily.reactlibrary'
    defaultConfig {
        versionCode 1
        versionName '0.1.0'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'co.daily:client:0.40.0'
    implementation 'androidx.core:core:1.15.0'
}
